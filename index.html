function asub(){const o=ti().filter(s=>s.pl.e<MIN+25).sort((a,b)=>a.pl.e-b.pl.e)[0];if(!o)return;const c=S.sl.filter(s=>s.t!="Titular"&&!s.pl.off&&s.pl.e>=MIN&&pen(s.pl,o.p)<99).sort((x,y)=>ef(y.pl,o.p)-ef(x.pl,o.p))[0];if(!c)return;[o.pl,c.pl]=[c.pl,o.pl];c.pl.off=1;S.M.subs++}
function fin(){const M=S.M,[gu,go]=M.g,H=M.home?S.t[0]:M.o,A=M.home?M.o:S.t[0],hg=M.home?gu:go,ag=M.home?go:gu;res(H,A,hg,ag);S.last=`Jornada ${S.round+1}: ${H.n} ${hg}-${ag} ${A.n}`;
M.rt=S.sl.filter(s=>s.pl.mp>0).map(s=>{const v=E(s.pl);return{n:s.pl.n,o:s.pl,a:v.a,p:s.pl.lp||s.p,g:v.g,v:Math.min(10,Math.max(4,6+(Math.random()-.5)*1.2+(gu>go?.3:gu<go?-.3:0)+(go==0&&["GK","CB","LB","RB","DM"].includes(s.pl.lp||s.p)?.3:0)+1.2*v.g+.7*v.a+.15*v.x+.25*v.v))}}).sort((a,b)=>b.v-a.v);
M.rt.forEach(r=>{const o=r.o,k=o.n+"|Mi equipo",e=S.ps[k]||(S.ps[k]={n:o.n,c:"Mi equipo",g:0,a:0,ap:0,rs:0,ga:0,gk:o.pos[0]=="GK"});e.ap++;e.g+=r.g;e.a+=r.a;e.rs+=r.v;if(r.p=="GK")e.ga+=go});ats(M.o,go,gu,Math.sign(go-gu),M.os);
S.sl.forEach(s=>{s.pl.e=Math.min(100,s.pl.e+(s.pl.mp>0?5:14))});S.round++}
function mview(r){S.mode="match";$.innerHTML='<div id="mh"></div><div id="mc"></div><div id="mp"></div><h2>Jugadas</h2><div id="ml"></div>';mupd();mctl();if(r)mrun(1)}
function mupd(){const M=S.M;el("mh").innerHTML=`<h1>${S.t[0].n} ${M.g[0]}-${M.g[1]} ${M.o.n}</h1><p>Minuto <b>${M.min}'</b> · Cambios ${M.subs}/5 · ${M.home?"Local":"Visitante"}</p><div class="bar"><i style="width:${M.min/.9}%"></i></div>`;el("mp").innerHTML=pitch();el("ml").innerHTML=M.lg.slice(-14).reverse().map(x=>`<div class="c">${x}</div>`).join("")}
function mctl(){el("mc").innerHTML=S.M.min>=90?'<button class="p" onclick="mend()">Ver valoraciones</button>':`<button class="p" onclick="mrun(${S.M.run?0:1})">${S.M.run?"⏸ Pausar":"▶ Seguir"}</button><button onclick="mfast()">⏭ Saltar al final</button><button onclick="msub()">🔁 Cambios</button>`}
function mrun(v){clearInterval(S.tm);S.M.run=v;if(v)S.tm=setInterval(()=>{if(S.mode!="match")return;step(0);mupd();if(S.M.min>=90){mrun(0);mctl()}},300);if(S.mode=="match")mctl()}
function mfast(){clearInterval(S.tm);S.M.run=0;while(S.M.min<90)step(0);mupd();mctl()}
function msub(){mrun(0);S.mode="msub";S.sel=null;msubv()}
function msubv(){$.innerHTML=`<h1>Cambios</h1><p>Minuto ${S.M.min}'. Arrastra un suplente sobre un titular (${S.M.subs}/5). Quien sale no vuelve a entrar.</p>`+pitch()+'<button class="p" onclick="S.sel=null;mview(0)">Volver al partido</button>'}
function mend(){clearInterval(S.tm);fin();$.innerHTML=`<h1>Final</h1><p>${S.last}</p><h2>Valoraciones</h2>`+S.M.rt.map(r=>`<div class="c"><span class="r">${r.v.toFixed(1)}</span>${r.n} <small>${r.p}${r.g?" · ⚽"+r.g:""}</small></div>`).join("")+'<button class="p" onclick="aft()">Continuar</button>'}
function aft(){if(S.round==19&&!S.swapped){S.swapped=1;S.mk=new Set();S.mode="swap";return swap()}table()}
function mkxi(q){const g=a=>q.filter(p=>a.includes(p.pos[0])).sort((x,y)=>y.r-x.r),u=new Set(),xi=[];const take=(l,n)=>{for(const p of l){if(xi.length>=11||n<=0)break;if(!u.has(p)){u.add(p);xi.push(p);n--}}};take(g(["GK"]),1);take(g(["CB","LB","RB"]),4);take(g(["DM","CM","OM","LM","RM"]),3);take(g(["ST","CF","LW","RW"]),3);take([...q].sort((x,y)=>y.r-x.r),11-xi.length);return xi}
function ats(t,g,ga,res,pre){if(!t.xi)return;const xi=t.xi.filter(()=>Math.random()<.93);(pre||[]).forEach(p=>{if(p&&!xi.includes(p))xi.push(p)});const sc=[],asx=[];
for(let i=0;i<g;i++){const p=(pre&&pre[i])||wr(xi);sc.push(p);if(Math.random()<.7)asx.push(wr(xi,p))}
for(const p of xi){const k=p.n+"|"+t.n,o=S.ps[k]||(S.ps[k]={n:p.n,c:t.n,g:0,a:0,ap:0,rs:0,ga:0,gk:p.pos[0]=="GK"}),gs=sc.filter(x=>x==p).length,as=asx.filter(x=>x==p).length,gk=p.pos[0]=="GK";
o.ap++;o.g+=gs;o.a+=as;o.rs+=Math.max(4,Math.min(10,6+(p.r-75)*.03+(Math.random()-.5)*1.2+res*.3+1.2*gs+.7*as+(gk?(ga==0?.5:-.2*ga):0)));if(gk)o.ga+=ga}}
function recs(me,pos,mine){let R={};try{R=JSON.parse(localStorage.getItem("dfc_rec")||"{}")}catch(e){}
const bp=[...mine].sort((a,b)=>b.g-a.g)[0],ba=[...mine].sort((a,b)=>b.a-a.a)[0],bm=mine.filter(x=>x.ap>=10).sort((a,b)=>b.rs/b.ap-a.rs/a.ap)[0];
const C=[["pos","Mejor puesto",pos,(n,o)=>n<o,""],["pts","Más puntos",me.pts,(n,o)=>n>o,""],["gf","Más goles a favor",me.gf,(n,o)=>n>o,""],["ga","Menos goles en contra",me.ga,(n,o)=>n<o,""],["pg","Máx. goles de un jugador tuyo",bp?bp.g:0,(n,o)=>n>o,bp?bp.n:""],["pa","Máx. asistencias de un jugador tuyo",ba?ba.a:0,(n,o)=>n>o,ba?ba.n:""],["mv","Mejor valoración media (tuya)",bm?+(bm.rs/bm.ap).toFixed(2):0,(n,o)=>n>o,bm?bm.n:""]];
let h="<h2>Récords</h2>";
for(const[k,l,v,b,w]of C){const o=R[k],nw=!o||b(v,o.v);if(nw)R[k]={v,w};h+=`<div class="c"><small>${l}</small><span class="r">${R[k].v}${nw&&o?" 🆕":""}</span><br>${R[k].w||"&nbsp;"}</div>`}
R.ch=(R.ch||0)+(pos==1?1:0);R.n=(R.n||0)+1;try{localStorage.setItem("dfc_rec",JSON.stringify(R))}catch(e){}
return h+`<p>Temporadas jugadas: <b>${R.n}</b> · Títulos: <b>${R.ch}</b></p>`}
function summary(){S.mode="sum";const r=rank(),pos=r.findIndex(t=>t.me)+1,me=S.t[0],L=Object.values(S.ps),mine=L.filter(x=>x.c=="Mi equipo");
const gl=L.filter(x=>x.gk&&x.ap>=15).sort((a,b)=>a.ga/a.ap-b.ga/b.ap),sc=[...L].sort((a,b)=>b.g-a.g||b.a-a.a),as=[...L].sort((a,b)=>b.a-a.a||b.g-a.g),mv=L.filter(x=>x.ap>=15).sort((a,b)=>b.rs/b.ap-a.rs/a.ap);
S.lists={g:sc,a:as,v:mv,z:gl};S.rh=S.rh||recs(me,pos,mine);save();
const aw=(t,x,v)=>x?`<div class="c"><small>${t}</small><span class="r">${v}</span><br><b>${full(x)}</b> <small>${x.c}</small></div>`:"";
$.innerHTML=`<h1>Resumen de temporada</h1><p>Campeón: <b>${r[0].n}</b> · Tu puesto: <b>${pos}º</b> (${me.pts} pts, ${me.gf}-${me.ga})</p>`+aw("🥇 Máximo goleador",sc[0],sc[0]&&sc[0].g+" goles")+aw("🎯 Máximo asistente",as[0],as[0]&&as[0].a+" asist.")+aw("⭐ MVP de la liga",mv[0],mv[0]&&(mv[0].rs/mv[0].ap).toFixed(2))+aw("🧤 Portero menos goleado",gl[0],gl[0]&&(gl[0].ga/gl[0].ap).toFixed(2)+" por partido")+S.rh+`<h2>Listas de la liga</h2><div id="tb"></div><div class="w" id="ls"></div><p><small>Las listas incluyen a los jugadores de equipos con plantilla real.</small></p><button class="p" onclick="home()">Nueva partida</button>`;stab("g")}
function stab(t){const L=S.lists[t].slice(0,20),f={g:x=>x.g+" ⚽",a:x=>x.a+" 🎯",v:x=>(x.rs/x.ap).toFixed(2),z:x=>(x.ga/x.ap).toFixed(2)}[t],nm={g:"Goleadores",a:"Asistentes",v:"MVP",z:"Porteros"};
document.getElementById("tb").innerHTML=Object.keys(nm).map(k=>`<button class="ch2${k==t?" on":""}" onclick="stab('${k}')">${nm[k]}</button>`).join("");
document.getElementById("ls").innerHTML=`<table><tr><th>#</th><th>Jugador</th><th>PJ</th><th>${nm[t]}</th></tr>${L.map((x,i)=>`<tr class="${x.c=="Mi equipo"?"me":""}"><td>${i+1}</td><td>${x.n}<br><small>${x.c}</small></td><td>${x.ap}</td><td>${f(x)}</td></tr>`).join("")}</table>`}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&S.mode=="match"&&S.M&&S.M.run)mrun(0)});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
home();
</script></body></html>
